<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sea Serenity Steak House</title>

<style>
body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.header {
    background: #000;
    border-bottom: 4px solid #c99a32;
    padding: 25px 10px;
}

.header h1 {
    color: #ffffff;
    margin: 0;
    font-size: 38px;
}

.header p {
    color: #d6b35a;
    margin: 8px 0 0;
}

.menu {
    padding: 25px;
}

button {
    display: block;
    width: 85%;
    max-width: 600px;
    margin: 15px auto;
    padding: 22px;
    background: #111;
    color: white;
    border: 2px solid #c99a32;
    border-radius: 12px;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #c99a32;
    color: black;
}

.cart {
    background: #c99a32;
    color: black;
}

.footer {
    color: #888;
    padding: 15px;
}
</style>
</head>

<body>

<div class="header">
    <h1>SEA SERENITY STEAK HOUSE</h1>
    <p>Fine Dining • Steak • Cocktails</p>
</div>

<div class="menu">

    <button>🥐 APPETIZERS</button>

    <button>🥗 SALAD &amp; SOUP</button>

    <button>🥩 ENTRÉES</button>

    <button>🍰 DESSERTS</button>

    <button>🍸 DRINKS</button>

    <button class="cart">🛒 VIEW ORDER</button>

</div>

<div class="footer">
    Welcome to Sea Serenity Steak House
</div>

</body>
</html>
